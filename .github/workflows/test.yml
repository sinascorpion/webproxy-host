name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y nginx python3-cryptography
      - run: mkdir -p dist && CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/webproxy-host_linux_amd64 .
      - run: /usr/bin/python3 tools/integration.py
